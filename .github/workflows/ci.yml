name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: prep
          POSTGRES_PASSWORD: prep
          POSTGRES_DB: prep
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prep" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://prep:prep@localhost:5432/prep
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run lint
      - run: npm run test -w apps/api
      - run: npm run test -w apps/web -- --watch=false
      - name: Migrate and seed a real database
        run: npm run db:migrate && npm run db:seed
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web
