# Local development: `docker compose up -d postgres`, then `npm run dev`.
# Full stack in containers: `docker compose --profile app up --build`.
# Ollama: uses the one installed on your computer (http://localhost:11434) by default.
# No Ollama installed? `docker compose --profile ollama up -d` and keep OLLAMA_URL as is.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prep
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prep']
      interval: 5s
      retries: 10

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports: ['11434:11434']
    volumes: [ollama:/root/.ollama]

  api:
    profiles: [app]
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://prep:prep@postgres:5432/prep
      # Reaches Ollama running on your computer from inside the container.
      OLLAMA_URL: http://host.docker.internal:11434
      CORS_ORIGIN: http://localhost:8080
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['3000:3000']

  web:
    profiles: [app]
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on: [api]
    ports: ['8080:80']

volumes:
  pgdata:
  ollama:
